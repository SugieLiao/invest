<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>半导体行业课</title>
<script src="/shared/nav.js?v=20260924b" defer></script>
<script src="/shared/edit.js?v=20260924h" defer></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f5f6f8;
  color: #1f2329;
  line-height: 1.7;
}
.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 20px;
}
.header {
  text-align: center;
  margin-bottom: 50px;
  padding-bottom: 30px;
  border-bottom: 1px solid #e0e0e0;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  margin-bottom: 12px;
  color: #1f2329;
}
.header p {
  color: #6b7280;
  font-size: 15px;
}
.course-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.course-card {
  background: #fff;
  border-radius: 12px;
  padding: 24px 28px;
  box-shadow: 0 1px 3px rgba(0,0,0,.06);
  transition: all .2s;
  text-decoration: none;
  color: inherit;
  display: block;
}
.course-card:hover {
  box-shadow: 0 4px 12px rgba(0,0,0,.1);
  transform: translateY(-2px);
}
.course-card .course-num {
  display: inline-block;
  background: #eef4fb;
  color: #1366d6;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 6px;
  margin-bottom: 10px;
}
.course-card h2 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  color: #1f2329;
}
.course-card p {
  color: #6b7280;
  font-size: 14px;
  line-height: 1.6;
}
.course-card .course-meta {
  margin-top: 12px;
  display: flex;
  gap: 16px;
  font-size: 13px;
  color: #9ca3af;
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>半导体行业课</h1>
    <p>半导体行业研究，算力芯片、设计制造封测、AIDC新基建等</p>
  </div>

  <div class="course-list">
    <a href="260818/" class="course-card">
      <span class="course-num">260818</span>
      <h2>十万平米WAIC背后——这两年看AI，最关键的变化是什么</h2>
      <p>WAIC规模与展区热度、超节点量产元年（驱动/共识/厂商格局/产业链国产化率）、存储链与长鑫、互联链与华为自研边界、Token工厂、具身智能与宇树、大模型分化与长期趋势。</p>
      <div class="course-meta">
        <span>2026-08-18</span>
        <span>趋势知识圈儿</span>
      </div>
    </a>

    <a href="260922/" class="course-card">
      <span class="course-num">260922</span>
      <h2>中国AIDC万亿新基建何时休</h2>
      <p>全球AIDC资本开支与供需共振、算力密度提升、中美布局差异、算电协同、六大系统与成本结构深度对谈。</p>
      <div class="course-meta">
        <span>2026-09-22</span>
        <span>趋势知识圈儿</span>
      </div>
    </a>
  </div>
</div>
</body>
</html>
