<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国宏观货币看板 · 储备货币 / M1</title>
<script src="/shared/nav.js" defer></script>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --card-border: #21262d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --red: #f5484d;    /* 涨/正增长 */
    --green: #00b578;  /* 跌/负增长 */
    --gold: #f0b90b;   /* 总量曲线 */
    --blue: #4c8dff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    min-height: 100vh;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 20px 60px; }
  header h1 { font-size: 22px; font-weight: 600; letter-spacing: .5px; }
  header .sub { color: var(--text-dim); font-size: 13px; margin-top: 6px; }
  header .sub b { color: var(--text); font-weight: 500; }

  .section {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 22px 24px 18px;
    margin-top: 24px;
  }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
  .sec-head h2 { font-size: 17px; font-weight: 600; }
  .sec-head .src { font-size: 12px; color: var(--text-dim); }

  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 18px 0 8px; }
  @media (max-width: 720px) { .cards { grid-template-columns: 1fr; } }
  .kpi {
    background: #0d1117;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .kpi .label { font-size: 12px; color: var(--text-dim); }
  .kpi .value { font-size: 26px; font-weight: 650; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .kpi .unit { font-size: 13px; color: var(--text-dim); font-weight: 400; margin-left: 2px; }
  .kpi .extra { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .up { color: var(--red); }
  .down { color: var(--green); }
  .flat { color: var(--text); }

  .chart-box { position: relative; margin-top: 14px; }
  .legend { display: flex; gap: 18px; font-size: 12px; color: var(--text-dim); margin-top: 10px; flex-wrap: wrap; }
  .legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

  .note { font-size: 12px; color: var(--text-dim); margin-top: 12px; line-height: 1.7; border-top: 1px dashed var(--card-border); padding-top: 10px; }

  #tip {
    position: fixed; display: none; pointer-events: none;
    background: rgba(22,27,34,.97); border: 1px solid #30363d; border-radius: 8px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.8; z-index: 10;
    box-shadow: 0 6px 20px rgba(0,0,0,.45); white-space: nowrap;
  }
  #tip .t-month { color: var(--text-dim); font-size: 11.5px; margin-bottom: 2px; }
  #tip .t-row { font-variant-numeric: tabular-nums; }
  #tip .t-row b { font-weight: 600; }
  .legend .line-sw { height: 3px !important; border-radius: 2px; }
  .err { color: var(--red); font-size: 13px; padding: 30px 0; text-align: center; }
  footer { margin-top: 26px; color: var(--text-dim); font-size: 12px; text-align: center; }
  footer a { color: var(--blue); text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>中国宏观货币看板</h1>
    <div class="sub" id="subtitle">储备货币（基础货币）· M1 货币供应量 — 每周更新</div>
  </header>
  <div id="err" class="err" style="display:none"></div>
  <div id="sections"></div>
  <footer>
    数据来源：中国人民银行（月度）· 更新时间 <span id="upd">—</span><br>
    <a href="https://liaohao.cc/stock-a/" style="margin-right:12px">A股每日复盘 →</a>
    <a href="https://liaohao.cc/dictation/">听写练习 →</a>
  </footer>
</div>
<div id="tip"></div>

<script>
"use strict";
const C = { red:"#f5484d", green:"#00b578", gold:"#f0b90b", dim:"#8b949e", grid:"#21262d", text:"#e6edf3", bar:"#3d7eff" };

async function boot() {
  let data;
  try {
    const r = await fetch("data.json", {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    data = await r.json();
  } catch (e) {
    document.getElementById("err").style.display = "block";
    document.getElementById("err").textContent = "数据加载失败：" + e.message + "，请刷新重试。";
    return;
  }
  document.getElementById("upd").textContent = fmtUpdated(data.updated_at);

  const host = document.getElementById("sections");
  host.appendChild(buildSection(data.base_money));
  host.appendChild(buildSection(data.m1));
}

function fmtUpdated(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString("zh-CN", {year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  } catch(e) { return iso || "—"; }
}

function buildSection(cfg) {
  const sec = document.createElement("div");
  sec.className = "section";
  const L = cfg.latest;
  const yoyCls = L.yoy == null ? "flat" : (L.yoy > 0 ? "up" : L.yoy < 0 ? "down" : "flat");
  const yoyTxt = L.yoy == null ? "—" : ((L.yoy > 0 ? "+" : "") + L.yoy.toFixed(2) + "%");
  const yoyDesc = cfg.yoy_mode === "official" ? "同比（官方可比口径）" : "同比（按12个月前计算）";
  // 同比曲线颜色随最新值涨跌：涨红 / 跌绿
  const curveColor = L.yoy == null ? C.dim : (L.yoy >= 0 ? C.red : C.green);

  sec.innerHTML = `
    <div class="sec-head">
      <h2>板块 · ${cfg.name}</h2>
      <span class="src">${cfg.source}</span>
    </div>
    <div class="cards">
      <div class="kpi">
        <div class="label">最新月份</div>
        <div class="value">${L.month}</div>
        <div class="extra">月度数据</div>
      </div>
      <div class="kpi">
        <div class="label">总量</div>
        <div class="value">${L.value.toFixed(2)}<span class="unit">万亿元</span></div>
        <div class="extra">${L.month} 月末余额</div>
      </div>
      <div class="kpi">
        <div class="label">同比变化</div>
        <div class="value ${yoyCls}">${yoyTxt}</div>
        <div class="extra">${yoyDesc}</div>
      </div>
    </div>
    <div class="chart-box"></div>
    <div class="legend">
      <span><span class="sw" style="background:${C.bar}"></span>总量（万亿元，左轴）</span>
      <span><span class="sw line-sw" style="background:${curveColor}"></span>同比（%，右轴）</span>
      <span><span class="sw" style="background:#30363d"></span>同比 0% 基准线</span>
    </div>
    <div class="note">${cfg.name === "M1 货币供应量"
      ? "口径说明：自 2024 年 1 月起 M1 采用新统计口径（增加个人活期存款、非银行支付机构客户备付金），图中虚线为口径切换位置，切换前后总量不可直接比较；同比增速为官方可比口径。"
      : "口径说明：储备货币 = 货币发行 + 金融性公司存款（准备金），即基础货币，数据出自央行《货币当局资产负债表》；同比按 12 个月前余额计算。"}
    </div>`;
  drawChart(sec.querySelector(".chart-box"), cfg);
  return sec;
}

/* ---------- SVG 双层图：总量柱状图（左轴） + 同比平滑曲线（右轴） ---------- */
function drawChart(box, cfg) {
  const series = cfg.series;
  const W = 1060, H = 330, PADL = 48, PADR = 48, PADT = 16, PADB = 28;
  const IW = W - PADL - PADR, IH = H - PADT - PADB;
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.style.width = "100%";
  svg.style.height = "auto";
  svg.style.display = "block";
  svg.style.touchAction = "none";

  const L = cfg.latest;
  const curveColor = L.yoy == null ? C.dim : (L.yoy >= 0 ? C.red : C.green);

  const vals = series.map(r => r.v);
  const yoys = series.map(r => r.yoy).filter(y => y != null);
  const vMin = Math.min(...vals), vMax = Math.max(...vals);
  const vPad = (vMax - vMin) * 0.10 || 1;
  const vLo = Math.max(0, vMin - vPad), vHi = vMax + vPad;
  const yMin = Math.min(0, ...yoys), yMax = Math.max(0, ...yoys);
  const yPad = Math.max(0.6, (yMax - yMin) * 0.12);
  const yLo = yMin - yPad, yHi = yMax + yPad;

  const x = i => PADL + (series.length === 1 ? IW / 2 : i * IW / (series.length - 1));
  const yV = v => PADT + (vHi - v) / (vHi - vLo) * IH;   // 总量柱（左轴）
  const yY = yy => PADT + (yHi - yy) / (yHi - yLo) * IH; // 同比曲线（右轴）
  const baseY = PADT + IH;

  const el = (t, attrs, parent) => {
    const e = document.createElementNS(ns, t);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || svg).appendChild(e);
    return e;
  };

  /* 网格 + 左轴刻度（总量，万亿元） */
  const ticks = 5;
  for (let t = 0; t <= ticks; t++) {
    const v = vLo + (vHi - vLo) * t / ticks;
    const gy = yV(v);
    el("line", {x1: PADL, x2: W - PADR, y1: gy, y2: gy, stroke: C.grid, "stroke-width": 1, "stroke-dasharray": "2,4"});
    const lab = el("text", {x: PADL - 6, y: gy + 4, fill: C.dim, "font-size": 10, "text-anchor": "end"});
    lab.textContent = v.toFixed(0);
  }
  /* 右轴刻度（同比 %） */
  for (const yy of [yHi, (yHi + yLo) / 2, yLo]) {
    const lab = el("text", {x: W - PADR + 6, y: yY(yy) + 4, fill: C.dim, "font-size": 10, "text-anchor": "start"});
    lab.textContent = yy.toFixed(1) + "%";
  }
  /* 同比 0% 基准线 */
  if (yLo < 0 && yHi > 0) {
    el("line", {x1: PADL, x2: W - PADR, y1: yY(0), y2: yY(0), stroke: "#3d444d", "stroke-width": 1, "stroke-dasharray": "5,4"});
    const zt = el("text", {x: W - PADR + 6, y: yY(0) + 4, fill: C.dim, "font-size": 10, "text-anchor": "start"});
    zt.textContent = "0%";
  }

  /* 总量柱状图 */
  const bw = Math.max(1.6, IW / series.length * 0.66);
  const bars = [];
  series.forEach((r, i) => {
    bars.push(el("rect", {
      x: x(i) - bw / 2, y: yV(r.v), width: bw,
      height: Math.max(baseY - yV(r.v), 1),
      fill: C.bar, opacity: 0.78, rx: 1
    }));
  });

  /* 口径切换标记（如 M1 2024-01 新口径） */
  const bm = cfg.break_marker;
  const bi = bm ? series.findIndex(r => r.m === bm.month) : -1;
  if (bi > 0) {
    const bx = x(bi);
    el("line", {x1: bx, x2: bx, y1: PADT, y2: baseY, stroke: "#e3b341", "stroke-width": 1, "stroke-dasharray": "4,4", opacity: .85});
    const bl = el("text", {x: bx + 5, y: PADT + 12, fill: "#e3b341", "font-size": 10});
    bl.textContent = bm.label;
  }

  /* 同比平滑曲线（Catmull-Rom → 贝塞尔） */
  const pts = [];
  series.forEach((r, i) => { if (r.yoy != null) pts.push([x(i), yY(r.yoy)]); });
  if (pts.length > 1) {
    let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || pts[i + 1];
      const t = 0.18;
      const c1x = p1[0] + (p2[0] - p0[0]) * t, c1y = p1[1] + (p2[1] - p0[1]) * t;
      const c2x = p2[0] - (p3[0] - p1[0]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;
      d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
    }
    el("path", {d: d, fill: "none", stroke: curveColor, "stroke-width": 2.2, "stroke-linecap": "round", "stroke-linejoin": "round"});
  }
  const lastPt = pts[pts.length - 1];
  if (lastPt) el("circle", {cx: lastPt[0], cy: lastPt[1], r: 3.6, fill: curveColor, stroke: "#0d1117", "stroke-width": 1.5});

  /* X 轴：每年 1 月打标 */
  series.forEach((r, i) => {
    if (r.m.endsWith("-01")) {
      el("line", {x1: x(i), x2: x(i), y1: baseY, y2: baseY + 4, stroke: C.dim, "stroke-width": 1});
      const t = el("text", {x: x(i), y: baseY + 18, fill: C.dim, "font-size": 10.5, "text-anchor": "middle"});
      t.textContent = r.m.slice(0, 4);
    }
  });
  const last = series[series.length - 1];
  const lt = el("text", {x: W - PADR, y: baseY + 18, fill: C.text, "font-size": 10.5, "text-anchor": "end"});
  lt.textContent = last.m.slice(2);

  /* ---------- 悬浮 / 触摸 tooltip ---------- */
  const tip = document.getElementById("tip");
  const guide = el("line", {x1: 0, x2: 0, y1: PADT, y2: baseY, stroke: "#e6edf3", "stroke-width": .8, opacity: 0});
  const dot = el("circle", {r: 4, fill: curveColor, stroke: "#0d1117", "stroke-width": 1.6, opacity: 0});
  const barHi = el("rect", {y: PADT, width: bw, height: IH, fill: "#ffffff", opacity: 0});

  function showTip(clientX, clientY) {
    const rect = svg.getBoundingClientRect();
    const px = (clientX - rect.left) * W / rect.width;
    let i = Math.round((px - PADL) / IW * (series.length - 1));
    i = Math.max(0, Math.min(series.length - 1, i));
    const r = series[i];
    bars.forEach((b, j) => b.setAttribute("opacity", j === i ? 1 : 0.66));
    guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i)); guide.setAttribute("opacity", .5);
    barHi.setAttribute("x", x(i) - bw / 2); barHi.setAttribute("opacity", .09);
    if (r.yoy != null) {
      dot.setAttribute("cx", x(i)); dot.setAttribute("cy", yY(r.yoy)); dot.setAttribute("opacity", 1);
    } else {
      dot.setAttribute("opacity", 0);
    }
    const yoy = r.yoy == null ? "—" : ((r.yoy > 0 ? "+" : "") + r.yoy.toFixed(2) + "%");
    const yoyColor = r.yoy == null ? C.text : (r.yoy >= 0 ? C.red : C.green);
    tip.innerHTML = `<div class="t-month">${r.m}</div>`
      + `<div class="t-row">总量：<b>${r.v.toFixed(2)}</b> 万亿元</div>`
      + `<div class="t-row">同比：<b style="color:${yoyColor}">${yoy}</b></div>`;
    tip.style.display = "block";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let tx = clientX + 16, ty = clientY - th - 12;
    if (tx + tw > window.innerWidth - 8) tx = clientX - tw - 16;
    if (ty < 8) ty = clientY + 16;
    tip.style.left = tx + "px"; tip.style.top = ty + "px";
  }
  function hideTip() {
    tip.style.display = "none";
    guide.setAttribute("opacity", 0);
    dot.setAttribute("opacity", 0);
    barHi.setAttribute("opacity", 0);
    bars.forEach(b => b.setAttribute("opacity", 0.78));
  }

  svg.addEventListener("mousemove", ev => showTip(ev.clientX, ev.clientY));
  svg.addEventListener("mouseleave", hideTip);
  svg.addEventListener("touchstart", ev => {
    if (ev.touches[0]) showTip(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive: true});
  svg.addEventListener("touchmove", ev => {
    if (ev.touches[0]) showTip(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive: true});
  svg.addEventListener("touchend", hideTip);

  box.appendChild(svg);
}

boot();
</script>
</body>
</html>
